name: car_store
description: "Um aplicativo simples para gerenciamento de estoque de veículos"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  
  # State management
  provider: ^6.1.1
  firebase_storage: ^13.0.4
  cloud_firestore: ^6.1.0
  google_sign_in: ^6.2.1
  firebase_auth: ^6.1.2
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/